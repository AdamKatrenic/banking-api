services:
  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    environment:
      MYSQL_DATABASE: banking_api
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: banking-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/banking_api
      DB_USERNAME: root
      DB_PASSWORD: root123
      JWT_SECRET: mojTajnyKlucKtoryMusiBytDostatorneVelkyMinimalne32Znakov
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: